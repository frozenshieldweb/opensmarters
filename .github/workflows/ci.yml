name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (the tag is in the comment).
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch libmpv
        shell: pwsh
        run: ./tools/fetch-libmpv.ps1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The installer's dev-feature tests drive the real binary (--quiet install, repair,
      # uninstall through the installed uninstall.exe, exit codes) in sandboxes that use the
      # test registry root HKCU\Software\opensmartersTest and temp folders.
      - name: Installer tests (sandboxed)
        run: cargo test -p opensmarters-installer --features dev
      - name: Installer headless install/uninstall (sandboxed)
        shell: pwsh
        run: |
          $sb = Join-Path $env:RUNNER_TEMP 'opensmarters-setup-sandbox'
          cargo build -p opensmarters-installer --features dev --bin opensmarters-setup
          $setup = 'target/debug/opensmarters-setup.exe'
          & $setup --quiet --no-launch --desktop-shortcut --sandbox $sb
          if ($LASTEXITCODE -ne 0) { throw "quiet install failed ($LASTEXITCODE)" }
          $dir = Join-Path $sb 'LocalAppData/Programs/opensmarters'
          foreach ($f in 'opensmarters.exe', 'libmpv-2.dll', 'uninstall.exe', 'install-manifest.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          & (Join-Path $dir 'uninstall.exe') --uninstall --quiet --sandbox $sb
          if ($LASTEXITCODE -ne 0) { throw "quiet uninstall failed ($LASTEXITCODE)" }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $dir) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (Test-Path $dir) { throw "the install folder was not removed" }
          Get-Content (Join-Path $sb 'Temp/opensmarters-setup.log')
          Remove-Item -Recurse -Force 'HKCU:\Software\opensmartersTest' -ErrorAction SilentlyContinue

  # cargo-deny covers the RustSec advisories (vulnerable, unmaintained and yanked crates),
  # licences, bans and sources (deny.toml).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: index.html and the copied assets are up to date
        run: node site/scripts/build.mjs --check
