name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A rare abort ("unsafe precondition(s) violated") was seen once in a debug test run,
# without a backtrace; always print one so a recurrence names the library.
env:
  RUST_BACKTRACE: full

# Actions are pinned to commit SHAs (the tag is in the comment).
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1  # = rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch libmpv
        shell: pwsh
        run: ./tools/fetch-libmpv.ps1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Failures are also reported as annotations (the run summary shows them, and they're
      # readable without access to the logs).
      - name: Test
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'test.log'
          cargo test --workspace --no-fail-fast 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = @(Get-Content $log)
            $n = 0
            for ($i = 0; $i -lt $lines.Count -and $n -lt 8; $i++) {
              if ($lines[$i] -match 'panicked at') {
                $msg = ($lines[$i..([Math]::Min($i + 5, $lines.Count - 1))] -join ' | ').Replace('%', '%25')
                "::error title=test panic::$msg"
                $n++
              }
            }
            $failed = ($lines | Where-Object { $_ -match '^test .+ \.\.\. FAILED$' }) -join ', '
            if ($failed) { "::error title=failed tests::$($failed.Replace('%', '%25'))" }
          }
          exit $code
      # The installer's dev-feature tests drive the real binary (--quiet install, repair,
      # uninstall through the installed uninstall.exe, exit codes) in sandboxes that use the
      # test registry root HKCU\Software\opensmartersTest and temp folders.
      - name: Installer tests (sandboxed)
        run: cargo test -p opensmarters-installer --features dev
      - name: Installer headless install/uninstall (sandboxed)
        shell: pwsh
        run: |
          $sb = Join-Path $env:RUNNER_TEMP 'opensmarters-setup-sandbox'
          cargo build -p opensmarters-installer --features dev --bin opensmarters-setup
          $setup = 'target/debug/opensmarters-setup.exe'
          & $setup --quiet --no-launch --desktop-shortcut --sandbox $sb
          if ($LASTEXITCODE -ne 0) { throw "quiet install failed ($LASTEXITCODE)" }
          $dir = Join-Path $sb 'LocalAppData/Programs/opensmarters'
          foreach ($f in 'opensmarters.exe', 'libmpv-2.dll', 'uninstall.exe', 'install-manifest.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          & (Join-Path $dir 'uninstall.exe') --uninstall --quiet --sandbox $sb
          if ($LASTEXITCODE -ne 0) { throw "quiet uninstall failed ($LASTEXITCODE)" }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $dir) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (Test-Path $dir) { throw "the install folder was not removed" }
          Get-Content (Join-Path $sb 'Temp/opensmarters-setup.log')
          Remove-Item -Recurse -Force 'HKCU:\Software\opensmartersTest' -ErrorAction SilentlyContinue

  # cargo-deny covers the RustSec advisories (vulnerable, unmaintained and yanked crates),
  # licences, bans and sources (deny.toml).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: index.html and the copied assets are up to date
        run: node site/scripts/build.mjs --check

  # The web edition's server on Linux (its deployment target), with ffmpeg so the
  # streaming tests run instead of being skipped.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1  # = rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Clippy (crates/web)
        run: cargo clippy -p opensmarters-web --all-targets --locked -- -D warnings
      - name: Test (crates/web)
        run: cargo test -p opensmarters-web --locked

  # The Docker image builds, starts with only a secret key, passes its health check and
  # serves the demo. Nothing is pushed.
  web-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -f deploy/web/Dockerfile -t opensmarters-web:ci .
      - name: Start it with --demo and check it
        run: |
          key="$(docker run --rm opensmarters-web:ci --generate-secret-key)"
          docker run -d --name osw -p 127.0.0.1:8080:8080 -e OPENSMARTERS_SECRET_KEY="$key" \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            opensmarters-web:ci --demo
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/status && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/status | grep -q '"setup_required":false'
          docker exec osw opensmarters-web --healthcheck
          docker logs osw 2>&1 | tail -20
          docker rm -f -v osw
