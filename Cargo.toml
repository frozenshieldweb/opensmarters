[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/store",
    "crates/player",
    "crates/app",
    "crates/fake-panel",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/opensmarters/opensmarters"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

# Keep PIN hashing / cache crypto fast in debug builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
