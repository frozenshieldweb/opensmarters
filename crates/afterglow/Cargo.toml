[package]
name = "opensmarters-afterglow"
description = "opensmarters' Afterglow design system for egui: tokens, fonts, Phosphor icons, focus and gradient painting, motion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Imported as `afterglow` by the app and the installer.
name = "afterglow"
path = "src/lib.rs"

[dependencies]
# Same egui as eframe 0.37 (the app and the installer); no extra features needed here.
egui = { version = "0.37", default-features = false }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
# Safe WinRT projection: `UISettings.AnimationsEnabled` (reduced motion follows Windows).
windows = { version = "0.62", default-features = false, features = ["UI_ViewManagement"] }

[lints]
workspace = true
