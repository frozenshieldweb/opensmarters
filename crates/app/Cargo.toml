[package]
name = "opensmarters"
description = "Secure open-source IPTV player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "opensmarters"
path = "src/main.rs"

[lib]
# The app is a binary, but its modules are also a library so integration tests
# (tests/*.rs) can drive the session layer, router and focus engine directly.
name = "opensmarters_app"
path = "src/lib.rs"

[features]
default = []
## `--demo`: run the dev-only fake panel in-process and log in to it. Never enable in
## release builds.
demo = ["dep:fake-panel"]
## The dev/test harness flags (`--route`, `--keys`, `--screenshot-after/-out`,
## `--exit-after`, `--ppp`, `--window-size`): scripted input and screenshots for reviews
## and agents. Never enable in release builds (SR-03).
harness = []

[dependencies]
opensmarters-core = { path = "../core" }
opensmarters-store = { path = "../store" }
opensmarters-player = { path = "../player" }
# The Afterglow theme (tokens, fonts, icons, focus/gradient painting), shared with the installer.
opensmarters-afterglow = { path = "../afterglow" }
fake-panel = { path = "../fake-panel", optional = true }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
# Free space on the recordings disk (downloads and recordings stop before it fills up).
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    # OS font fallback for characters our fonts lack (CJK, Arabic, emoji in channel names).
    "system_fonts",
    "accesskit",
    "clipboard",
    "x11",
    "wayland",
] }
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lru = "0.18"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "ansi"] }

[target.'cfg(windows)'.dependencies]
# Safe WinRT projection: `UISettings.AnimationsEnabled` (reduced motion follows Windows).
windows = { version = "0.62", default-features = false, features = ["UI_ViewManagement"] }

[dev-dependencies]
fake-panel = { path = "../fake-panel" }

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
