[package]
name = "opensmarters-core"
description = "opensmarters core library: Xtream Codes client, lenient models, M3U/XMLTV parsers, stream URL builders, log redaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
flate2 = "1.1"
percent-encoding = "2.3"
quick-xml = "0.42"
# rustls only (no native-tls / OpenSSL); gzip bodies are decompressed while streaming, under the size cap.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tracing = "0.1"
unicode-normalization = "0.1"
url = "2.5"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"

[lints]
workspace = true
