[package]
name = "fake-panel"
description = "Dev-only fake Xtream Codes / M3U / XMLTV panel with synthetic data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fake_panel"
path = "src/lib.rs"

[[bin]]
name = "fake-panel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "matched-path"] }
base64 = "0.23"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }

[lints]
workspace = true
