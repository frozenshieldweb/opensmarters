[package]
name = "opensmarters-store"
description = "opensmarters persistence: SQLite store (profiles without secrets, favourites, resume points, encrypted cache, settings, parental control) and OS keychain wrapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# PIN hashing (Argon2id, PHC strings). `zeroize` wipes internal buffers.
argon2 = { version = "0.6", features = ["zeroize"] }
# Keyed BLAKE2b for cache-key ids and key derivation (already a dependency of argon2).
blake2 = { version = "0.11", features = ["zeroize"] }
# Cache-at-rest encryption (XChaCha20-Poly1305, random 192-bit nonces).
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
# Per-user data directory.
directories = "6"
# OS keychain. The default `v1` feature selects Windows Credential Manager, macOS Keychain
# and the (pure-Rust zbus) Secret Service on Linux/BSD. No OpenSSL, no libdbus.
keyring = "4.2"
# SQLite, statically linked (no system sqlite needed).
rusqlite = { version = "0.40", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
