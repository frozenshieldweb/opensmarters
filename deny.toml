# cargo-deny policy — run `cargo deny check`
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Linux-only accessibility stack (eframe -> accesskit_unix -> atspi -> zbus).
    # zbus_xml parses D-Bus introspection XML from the local session bus, never provider data.
    # Our own XML parsing (XMLTV) uses quick-xml >= 0.42 (crates/core). Revisit when accesskit updates.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 only via zbus_xml (Linux a11y, local D-Bus data)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 only via zbus_xml (Linux a11y, local D-Bus data)" },
    { id = "RUSTSEC-2026-0370", reason = "zbus crates unmaintained; Linux-only transitive deps of egui/keyring, no fix available" },
    { id = "RUSTSEC-2026-0371", reason = "zbus crates unmaintained; Linux-only transitive deps of egui/keyring, no fix available" },
    { id = "RUSTSEC-2026-0372", reason = "zbus crates unmaintained; Linux-only transitive deps of egui/keyring, no fix available" },
]

[licenses]
version = 2
# Everything here is compatible with distributing the app under GPL-3.0-or-later.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.9
exceptions = [
    # egui's bundled default fonts (Ubuntu-Light) — redistribution permitted.
    { allow = ["Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # TLS must be rustls; never link OpenSSL / native-tls.
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
