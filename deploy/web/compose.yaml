#
# opensmarters web with Docker Compose (local use, or Dokploy's "Compose" type).
# docs/WEB_DEPLOY.md explains every variable.
#
#   export OPENSMARTERS_SECRET_KEY="$(openssl rand -base64 32)"   # keep it safe
#   docker compose -f deploy/web/compose.yaml up -d --build
#   docker compose -f deploy/web/compose.yaml logs opensmarters-web   # the setup code
#
# Behind Dokploy, remove `ports:` and give the service a domain instead (Traefik
# terminates HTTPS and forwards to port 8080 inside the network).

services:
  opensmarters-web:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    image: opensmarters-web:local
    restart: unless-stopped
    environment:
      OPENSMARTERS_SECRET_KEY: ${OPENSMARTERS_SECRET_KEY:?set OPENSMARTERS_SECRET_KEY (32 random bytes, base64)}
      OPENSMARTERS_PUBLIC_URL: ${OPENSMARTERS_PUBLIC_URL:-}
      OPENSMARTERS_TRUSTED_PROXY: ${OPENSMARTERS_TRUSTED_PROXY:-private}
      OPENSMARTERS_MAX_STREAMS: ${OPENSMARTERS_MAX_STREAMS:-8}
      OPENSMARTERS_STREAMS_PER_USER: ${OPENSMARTERS_STREAMS_PER_USER:-1}
      OPENSMARTERS_TRANSCODE_VIDEO: ${OPENSMARTERS_TRANSCODE_VIDEO:-never}
      OPENSMARTERS_ALLOW_PRIVATE_PROVIDERS: ${OPENSMARTERS_ALLOW_PRIVATE_PROVIDERS:-0}
      OPENSMARTERS_SETUP_CODE: ${OPENSMARTERS_SETUP_CODE:-}
      OPENSMARTERS_LOG: ${OPENSMARTERS_LOG:-info}
    volumes:
      - opensmarters-data:/data
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  opensmarters-data:
