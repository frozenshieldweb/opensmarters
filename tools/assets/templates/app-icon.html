<!doctype html>
<!-- apple-touch-icon 180×180: full-bleed square (iOS rounds it), the app icon's plate
     gradient, the symbol at 64%. -->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; }
.p { width: 180px; height: 180px; display: grid; place-items: center;
  background: linear-gradient(180deg, #2A2026 0%, #141013 100%); }
.s { width: 64%; height: 64%; }
.s svg { width: 100%; height: 100%; display: block; }
</style></head><body><div class="p"><div class="s">{{SYMBOL_SVG}}</div></div></body></html>
